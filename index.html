<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Noticeboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #F5F0E8;
            color: #3D352A;
            font-weight: 300;
            line-height: 1.5;
            min-height: 100vh;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px 16px 48px;
        }

        /* header */
        .app-header {
            margin-bottom: 20px;
        }

        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #3D352A;
        }

        .app-header p {
            font-size: 0.85rem;
            color: #7A7062;
            margin-top: 2px;
        }

        /* search */
        .search-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .search-wrap input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #DDD6C8;
            border-radius: 12px;
            background: #FAF7F2;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #3D352A;
            outline: none;
            transition: border 0.2s;
        }

        .search-wrap input::placeholder {
            color: #B0A89A;
            font-weight: 300;
        }

        .search-wrap input:focus {
            border-color: #B8A99A;
            background: #FFFCF7;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.5;
            pointer-events: none;
        }

        /* urgent banner */
        .urgent-banner {
            background: #FDF6F0;
            border: 1px solid #F0D5C0;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .urgent-banner.show {
            display: flex;
        }

        .urgent-banner:hover {
            background: #FBEFE5;
        }

        .urgent-banner .icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .urgent-banner .text {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 400;
            color: #8B3A2A;
            line-height: 1.4;
        }

        .urgent-banner .text strong {
            font-weight: 500;
        }

        .urgent-banner .tap-hint {
            font-size: 0.7rem;
            color: #B09078;
            font-weight: 300;
            margin-top: 2px;
        }

        /* tasks */
        .tasks-section {
            margin-bottom: 20px;
        }

        .tasks-section h2 {
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #9A9080;
            margin-bottom: 10px;
        }

        .tasks-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: #DDD6C8 transparent;
            -webkit-overflow-scrolling: touch;
        }

        .tasks-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .tasks-scroll::-webkit-scrollbar-thumb {
            background: #DDD6C8;
            border-radius: 8px;
        }

        .task-card {
            flex: 0 0 200px;
            background: #FAF7F2;
            border: 1px solid #E5DDD0;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: opacity 0.3s, background 0.3s;
        }

        .task-card.done {
            opacity: 0.45;
        }

        .task-card.done .task-title {
            text-decoration: line-through;
        }

        .task-card input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid #CCC2B2;
            border-radius: 6px;
            flex-shrink: 0;
            margin-top: 1px;
            cursor: pointer;
            background: #FFFCF7;
            transition: background 0.2s, border 0.2s;
            position: relative;
        }

        .task-card input[type="checkbox"]:checked {
            background: #B8A99A;
            border-color: #B8A99A;
        }

        .task-card input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFCF7;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .task-card input[type="checkbox"]:focus-visible {
            outline: 2px solid #B8A99A;
            outline-offset: 2px;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 0.85rem;
            font-weight: 400;
            color: #3D352A;
            line-height: 1.35;
        }

        .task-due {
            font-size: 0.7rem;
            color: #9A9080;
            margin-top: 4px;
            font-weight: 300;
        }

        /* tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 18px;
            border: 1px solid #DDD6C8;
            border-radius: 10px;
            background: transparent;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            color: #7A7062;
            cursor: pointer;
            transition: background 0.2s, border 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            background: #FAF7F2;
            border-color: #CCC2B2;
        }

        .tab-btn.active {
            background: #EDE6DA;
            border-color: #CCC2B2;
            color: #3D352A;
            font-weight: 400;
        }

        .tab-btn:focus-visible {
            outline: 2px solid #B8A99A;
            outline-offset: 2px;
        }

        .tab-btn .icon {
            font-size: 1rem;
        }

        /* new post button */
        .new-post-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px dashed #CCC2B2;
            border-radius: 12px;
            background: #FAF7F2;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #7A7062;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background 0.2s, border 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-post-btn:hover {
            background: #F0EADD;
            border-color: #B8A99A;
            color: #3D352A;
        }

        .new-post-btn:focus-visible {
            outline: 2px solid #B8A99A;
            outline-offset: 2px;
        }

        /* feed */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-empty {
            text-align: center;
            padding: 40px 20px;
            color: #B0A89A;
            font-size: 0.9rem;
        }

        /* card */
        .announce-card {
            background: #FAF7F2;
            border: 1px solid #E5DDD0;
            border-radius: 12px;
            padding: 16px 18px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .announce-card:hover {
            background: #F7F2EA;
        }

        .announce-card:focus-visible {
            outline: 2px solid #B8A99A;
            outline-offset: 2px;
        }

        .announce-card .top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .badge-urgent {
            background: #FDE8E4;
            color: #C0392B;
        }

        .badge-normal {
            background: #FDF0DC;
            color: #B8860B;
        }

        .badge-low {
            background: #EDEBE6;
            color: #7F7A72;
        }

        .badge-category {
            font-size: 0.6rem;
            font-weight: 400;
            padding: 2px 10px;
            border-radius: 20px;
            background: #E8E2D8;
            color: #6A6052;
        }

        .announce-card .title {
            font-size: 0.95rem;
            font-weight: 400;
            color: #3D352A;
            line-height: 1.4;
            margin-bottom: 2px;
        }

        .announce-card .date {
            font-size: 0.7rem;
            color: #9A9080;
            font-weight: 300;
        }

        .announce-card .body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
            font-size: 0.88rem;
            color: #5D5448;
            line-height: 1.6;
            font-weight: 300;
        }

        .announce-card.open .body {
            max-height: 300px;
            opacity: 1;
            margin-top: 12px;
        }

        .announce-card .expand-icon {
            font-size: 0.7rem;
            color: #B0A89A;
            margin-left: auto;
            transition: transform 0.25s;
        }

        .announce-card.open .expand-icon {
            transform: rotate(180deg);
        }

        /* pulse animation for urgent scroll target */
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.1);
                background: #FAF7F2;
            }
            25% {
                box-shadow: 0 0 0 12px rgba(192, 57, 43, 0);
                background: #FDF0E8;
            }
            50% {
                box-shadow: 0 0 0 6px rgba(192, 57, 43, 0.05);
                background: #FDF0E8;
            }
            75% {
                box-shadow: 0 0 0 12px rgba(192, 57, 43, 0);
                background: #FAF7F2;
            }
        }

        .announce-card.pulse-target {
            animation: pulse-glow 1.6s ease-out;
        }

        /* footer */
        .footer-note {
            margin-top: 32px;
            text-align: center;
            font-size: 0.7rem;
            color: #B0A89A;
            font-weight: 300;
            border-top: 1px solid #E8E2D8;
            padding-top: 20px;
        }

        /* loading */
        .loading-note {
            text-align: center;
            padding: 30px 20px;
            color: #B0A89A;
            font-size: 0.85rem;
        }

        /* modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(61, 53, 42, 0.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: #FFFCF7;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(61, 53, 42, 0.2);
        }

        .modal-box h3 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #3D352A;
            margin-bottom: 16px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: #7A7062;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .field-group input[type="text"],
        .field-group input[type="password"],
        .field-group select,
        .field-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #DDD6C8;
            border-radius: 10px;
            background: #FAF7F2;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: #3D352A;
            outline: none;
            transition: border 0.2s;
        }

        .field-group input:focus,
        .field-group select:focus,
        .field-group textarea:focus {
            border-color: #B8A99A;
            background: #FFFCF7;
        }

        .field-group textarea {
            resize: vertical;
            min-height: 70px;
            font-family: "Inter", system-ui, sans-serif;
        }

        .field-row {
            display: flex;
            gap: 10px;
        }

        .field-row .field-group {
            flex: 1;
        }

        .captcha-wrap {
            margin-bottom: 14px;
        }

        .modal-error {
            font-size: 0.8rem;
            color: #C0392B;
            margin-bottom: 12px;
            display: none;
        }

        .modal-error.show {
            display: block;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-btn {
            flex: 1;
            padding: 11px 16px;
            border-radius: 10px;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s, opacity 0.2s;
        }

        .modal-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal-btn.cancel {
            background: transparent;
            border-color: #DDD6C8;
            color: #7A7062;
        }

        .modal-btn.cancel:hover {
            background: #F5F0E8;
        }

        .modal-btn.submit {
            background: #B8A99A;
            color: #FFFCF7;
        }

        .modal-btn.submit:hover {
            background: #A6957F;
        }

        /* responsive: wider screens get side-by-side tasks + feed */
        @media (min-width: 640px) {
            .app {
                max-width: 800px;
                padding: 32px 24px 48px;
            }

            .app-header h1 {
                font-size: 2rem;
            }

            .tasks-scroll {
                overflow-x: visible;
                flex-wrap: wrap;
            }

            .task-card {
                flex: 1 1 calc(33.33% - 10px);
                min-width: 180px;
            }
        }

        @media (min-width: 800px) {
            .layout-flex {
                display: flex;
                gap: 28px;
                align-items: flex-start;
            }

            .layout-flex .left-col {
                flex: 0 0 220px;
                position: sticky;
                top: 24px;
            }

            .layout-flex .right-col {
                flex: 1;
                min-width: 0;
            }

            .tasks-scroll {
                flex-direction: column;
                overflow-x: visible;
            }

            .task-card {
                flex: 0 0 auto;
                width: 100%;
            }

            .urgent-banner {
                margin-bottom: 0;
            }
        }

        /* accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::after,
            *::before {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .announce-card .body {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div class="app" role="main">

        <!-- header -->
        <header class="app-header">
            <h1>📋 School Noticeboard</h1>
            <p>Stay updated with announcements &amp; tasks</p>
        </header>

        <!-- search -->
        <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input type="text" id="searchInput" placeholder="Search announcements…" aria-label="Search announcements by keyword">
        </div>

        <!-- urgent banner (shown only when an urgent post exists) -->
        <div class="urgent-banner" id="urgentBanner" role="button" tabindex="0" aria-label="Tap to find urgent announcement">
            <span class="icon" aria-hidden="true">🚨</span>
            <div class="text">
                <strong id="urgentBannerTitle"></strong> — Tap for details
                <div class="tap-hint">scrolls to announcement</div>
            </div>
        </div>

        <!-- main layout wrapper -->
        <div class="layout-flex">

            <!-- left: tasks -->
            <div class="left-col">
                <section class="tasks-section" aria-label="Pending tasks">
                    <h2>📌 Pending Tasks</h2>
                    <div class="tasks-scroll" id="tasksContainer">
                        <!-- rendered by JS -->
                    </div>
                </section>
            </div>

            <!-- right: feed -->
            <div class="right-col">

                <!-- new post -->
                <button type="button" class="new-post-btn" id="newPostBtn">
                    <span aria-hidden="true">➕</span> New Post
                </button>

                <!-- tabs -->
                <nav class="tabs" role="tablist" aria-label="Filter announcements">
                    <button class="tab-btn active" role="tab" aria-selected="true" data-tab="all">
                        <span class="icon" aria-hidden="true">📌</span> All
                    </button>
                    <button class="tab-btn" role="tab" aria-selected="false" data-tab="General">
                        <span class="icon" aria-hidden="true">📋</span> General
                    </button>
                    <button class="tab-btn" role="tab" aria-selected="false" data-tab="Classroom">
                        <span class="icon" aria-hidden="true">✏️</span> Classroom
                    </button>
                    <button class="tab-btn" role="tab" aria-selected="false" data-tab="CCA">
                        <span class="icon" aria-hidden="true">🎭</span> CCA
                    </button>
                    <button class="tab-btn" role="tab" aria-selected="false" data-tab="Lost &amp; Found">
                        <span class="icon" aria-hidden="true">🧦</span> Lost &amp; Found
                    </button>
                </nav>

                <!-- feed -->
                <div class="feed" id="feedContainer" role="region" aria-label="Announcements feed">
                    <div class="loading-note">Loading announcements…</div>
                </div>

            </div>
        </div>

        <!-- footer -->
        <footer class="footer-note">
            Posts are visible to everyone using this board &middot; Your task checklist is saved just for you
        </footer>
    </div>

    <!-- new post modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 id="modalTitle">📋 New Announcement</h3>
            <div class="modal-error" id="modalError"></div>
            <form id="postForm">
                <div class="field-group">
                    <label for="postPassword">Password</label>
                    <input type="password" id="postPassword" autocomplete="off" required>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label for="postUrgency">Urgency</label>
                        <select id="postUrgency">
                            <option value="NORMAL">Normal</option>
                            <option value="URGENT">Urgent</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="postCategory">Category</label>
                        <select id="postCategory">
                            <option value="General">General</option>
                            <option value="Classroom">Classroom</option>
                            <option value="CCA">CCA</option>
                            <option value="Lost &amp; Found">Lost &amp; Found</option>
                        </select>
                    </div>
                </div>
                <div class="field-group">
                    <label for="postTitle">Title</label>
                    <input type="text" id="postTitle" required maxlength="120">
                </div>
                <div class="field-group">
                    <label for="postBody">Details</label>
                    <textarea id="postBody" required maxlength="500"></textarea>
                </div>
                <div class="captcha-wrap">
                    <!--
                        Google reCAPTCHA v2 checkbox widget.
                        This uses Google's published TEST site key, which always
                        validates and is meant only for development/demo use.
                        Replace data-sitekey below with a real site key from
                        https://www.google.com/recaptcha/admin registered to your
                        own domain before using this for real. Note: a static
                        HTML file has no server, so the CAPTCHA response can only
                        be checked client-side here (a determined bot could still
                        bypass it) — real protection requires verifying the
                        token against Google's siteverify API from a backend.
                    -->
                    <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
                    <button type="submit" class="modal-btn submit" id="modalSubmitBtn">Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (async function() {
            'use strict';

            // ---- posting password ----
            const POST_PASSWORD = 'TeacherAnnouncements2026';

            // ---- announcements start empty; posts come from storage ----
            let announcements = [];

            const tasksData = [
                { id: 't1', title: 'Submit History Group Project', due: 'Due 26 Aug' },
                { id: 't2', title: 'Math Revision Quiz (Ch 4–6)', due: '31 Aug' },
                { id: 't3', title: 'Bring EZ-Link top-up', due: '28 Aug' },
            ];

            // ---- storage helpers (uses browser localStorage — data stays on this device/browser only) ----
            async function loadPosts() {
                try {
                    const raw = localStorage.getItem('community-posts');
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            }

            async function savePosts(posts) {
                try {
                    localStorage.setItem('community-posts', JSON.stringify(posts));
                    return true;
                } catch (e) {
                    console.error('Failed to save post', e);
                    return false;
                }
            }

            async function loadDoneState() {
                try {
                    const raw = localStorage.getItem('task-done-state');
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    return {};
                }
            }

            async function saveDoneState(state) {
                try {
                    localStorage.setItem('task-done-state', JSON.stringify(state));
                } catch (e) {
                    console.error('Failed to save task state', e);
                }
            }

            function formatToday() {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const d = new Date();
                return `${d.getDate()} ${months[d.getMonth()]}`;
            }

            // ---- STATE ----
            let activeTab = 'all';
            let searchQuery = '';
            let doneState = {};

            // ---- DOM refs ----
            const feedEl = document.getElementById('feedContainer');
            const tasksEl = document.getElementById('tasksContainer');
            const searchInput = document.getElementById('searchInput');
            const urgentBanner = document.getElementById('urgentBanner');
            const urgentBannerTitle = document.getElementById('urgentBannerTitle');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const newPostBtn = document.getElementById('newPostBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalSubmitBtn = document.getElementById('modalSubmitBtn');
            const postForm = document.getElementById('postForm');
            const modalError = document.getElementById('modalError');
            const postPasswordInput = document.getElementById('postPassword');
            const postUrgencyInput = document.getElementById('postUrgency');
            const postCategoryInput = document.getElementById('postCategory');
            const postTitleInput = document.getElementById('postTitle');
            const postBodyInput = document.getElementById('postBody');

            // ---- render tasks ----
            function renderTasks() {
                let html = '';
                for (const t of tasksData) {
                    const isDone = !!doneState[t.id];
                    html += `
                    <div class="task-card ${isDone ? 'done' : ''}" data-task-id="${t.id}">
                        <input type="checkbox" id="chk_${t.id}" ${isDone ? 'checked' : ''} aria-label="Mark '${t.title}' as ${isDone ? 'incomplete' : 'complete'}">
                        <div class="task-info">
                            <div class="task-title">${t.title}</div>
                            <div class="task-due">${t.due}</div>
                        </div>
                    </div>`;
                }
                tasksEl.innerHTML = html;

                // attach events
                tasksEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', async function(e) {
                        const card = this.closest('.task-card');
                        const id = card.dataset.taskId;
                        if (this.checked) {
                            doneState[id] = true;
                        } else {
                            delete doneState[id];
                        }
                        await saveDoneState(doneState);
                        // update ui
                        card.classList.toggle('done', this.checked);
                        this.setAttribute('aria-label', `Mark '${card.querySelector('.task-title').textContent}' as ${this.checked ? 'incomplete' : 'complete'}`);
                    });
                });
            }

            // ---- filter logic ----
            function getFiltered() {
                let list = announcements;

                // tab filter
                if (activeTab !== 'all') {
                    list = list.filter(a => a.category === activeTab);
                }

                // search filter (case-insensitive)
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    list = list.filter(a =>
                        a.title.toLowerCase().includes(q) ||
                        a.body.toLowerCase().includes(q) ||
                        a.category.toLowerCase().includes(q) ||
                        a.urgency.toLowerCase().includes(q)
                    );
                }

                return list;
            }

            // ---- urgent banner ----
            function updateUrgentBanner() {
                const urgentPost = announcements.find(a => a.urgency === 'URGENT');
                if (urgentPost) {
                    urgentBannerTitle.textContent = urgentPost.title;
                    urgentBanner.dataset.targetId = urgentPost.id;
                    urgentBanner.classList.add('show');
                } else {
                    urgentBanner.classList.remove('show');
                    delete urgentBanner.dataset.targetId;
                }
            }

            // ---- render feed ----
            function renderFeed() {
                const list = getFiltered();
                if (list.length === 0) {
                    feedEl.innerHTML = `<div class="feed-empty">✨ No announcements yet</div>`;
                    return;
                }

                let html = '';
                for (const a of list) {
                    const urgencyClass = a.urgency === 'URGENT' ? 'badge-urgent' :
                        a.urgency === 'NORMAL' ? 'badge-normal' : 'badge-low';
                    html += `
                    <div class="announce-card" data-id="${a.id}" role="button" tabindex="0" aria-expanded="false">
                        <div class="top">
                            <span class="badge ${urgencyClass}">${a.urgency}</span>
                            <span class="badge-category">${a.category}</span>
                            <span class="expand-icon" aria-hidden="true">▾</span>
                        </div>
                        <div class="title">${a.title}</div>
                        <div class="date">Posted ${a.date}</div>
                        <div class="body">${a.body}</div>
                    </div>`;
                }
                feedEl.innerHTML = html;

                // attach expand toggle
                feedEl.querySelectorAll('.announce-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        this.classList.toggle('open');
                        const expanded = this.classList.contains('open');
                        this.setAttribute('aria-expanded', expanded);
                    });
                    card.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.click();
                        }
                    });
                });
            }

            // ---- full re-render ----
            function refresh() {
                renderTasks();
                updateUrgentBanner();
                renderFeed();
            }

            // ---- urgent banner scroll ----
            function scrollToUrgent() {
                const targetId = urgentBanner.dataset.targetId;
                if (!targetId) return;
                const urgentCard = feedEl.querySelector(`.announce-card[data-id="${targetId}"]`);
                if (!urgentCard) return;

                urgentCard.classList.add('open');
                urgentCard.setAttribute('aria-expanded', 'true');
                urgentCard.classList.remove('pulse-target');
                urgentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

                void urgentCard.offsetWidth;
                urgentCard.classList.add('pulse-target');

                setTimeout(() => {
                    urgentCard.classList.remove('pulse-target');
                }, 2000);
            }

            // ---- tab switching ----
            function setTab(tab) {
                activeTab = tab;
                tabBtns.forEach(btn => {
                    const isActive = btn.dataset.tab === tab;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', isActive);
                });
                renderFeed();
            }

            // ---- new post modal ----
            function showModalError(msg) {
                modalError.textContent = msg;
                modalError.classList.add('show');
            }

            function clearModalError() {
                modalError.textContent = '';
                modalError.classList.remove('show');
            }

            function resetCaptcha() {
                if (typeof grecaptcha !== 'undefined' && grecaptcha.render) {
                    try { grecaptcha.reset(); } catch (e) { /* not yet rendered */ }
                }
            }

            function openModal() {
                postForm.reset();
                clearModalError();
                resetCaptcha();
                modalOverlay.classList.add('open');
                postPasswordInput.focus();
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
            }

            newPostBtn.addEventListener('click', openModal);
            modalCancelBtn.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                    closeModal();
                }
            });

            postForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearModalError();

                if (postPasswordInput.value !== POST_PASSWORD) {
                    showModalError('Incorrect password. Posts require the announcement password.');
                    postPasswordInput.focus();
                    return;
                }

                const title = postTitleInput.value.trim();
                const body = postBodyInput.value.trim();
                if (!title || !body) {
                    showModalError('Please fill in both a title and details.');
                    return;
                }

                if (typeof grecaptcha === 'undefined') {
                    showModalError('CAPTCHA failed to load. Check your connection and try again.');
                    return;
                }
                const captchaResponse = grecaptcha.getResponse();
                if (!captchaResponse) {
                    showModalError('Please complete the CAPTCHA.');
                    return;
                }

                modalSubmitBtn.disabled = true;
                modalSubmitBtn.textContent = 'Posting…';

                const newPost = {
                    id: 'p' + Date.now(),
                    urgency: postUrgencyInput.value,
                    category: postCategoryInput.value,
                    title: title,
                    date: formatToday(),
                    body: body,
                };

                announcements.unshift(newPost);
                const ok = await savePosts(announcements);

                modalSubmitBtn.disabled = false;
                modalSubmitBtn.textContent = 'Post';

                if (!ok) {
                    announcements.shift();
                    showModalError('Could not save the post right now. Please try again.');
                    return;
                }

                closeModal();
                refresh();
            });

            // ---- event bindings ----
            // tabs
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setTab(this.dataset.tab);
                });
            });

            // search
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderFeed();
            });

            // urgent banner
            urgentBanner.addEventListener('click', scrollToUrgent);
            urgentBanner.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    scrollToUrgent();
                }
            });

            // ---- init ----
            async function init() {
                doneState = await loadDoneState();
                announcements = await loadPosts();
                refresh();
            }

            init();

        })();
    </script>

</body>
</html>
